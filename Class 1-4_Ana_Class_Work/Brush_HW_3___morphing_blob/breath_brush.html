<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Breath Brush</title>
  <style>
    body { margin: 0; overflow: hidden; background: #f5f0eb; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
// BREATH BRUSH
// Remix of P_2_2_3_01 (Generative Gestaltung)
//
// What changed from the original:
//   - noise() replaces random() for smoother, organic point drift
//   - colorMode(HSB) with soft shifting hues
//   - White background with alpha fade = watercolor accumulation
//   - NEW THING: sin(frameCount) breathing scale -- shape inhales and exhales
//
// MOUSE
//   click               : start a new shape at mouse position
//   position x/y        : direction of floating
//
// KEYS
//   +  /  -             : breathe faster / slower
//   f                   : freeze. loop on/off
//   Delete/Backspace    : clear display
//   s                   : save png

'use strict';

var formResolution = 15;
var stepSize        = 2;
var initRadius      = 150;
var centerX, centerY;
var x = [];
var y = [];

// noise() needs a unique "seed position" per point so they move independently
var noiseSeeds = [];
var noiseTime  = 0;
var noiseSpeed = 0.006;  // how fast the noise field evolves

// NEW THING: breathing
// sin(breathPhase) makes the whole shape scale up and down like an inhale/exhale
var breathPhase = 0;
var breathSpeed = 0.018;  // +/- keys control this

// HSB color -- hue drifts slowly over time
var hueVal = 200;  // start at a soft blue-purple

var freeze = false;


function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);  // H S B Alpha, all 0-100/360

  centerX = width / 2;
  centerY = height / 2;

  var angle = radians(360 / formResolution);
  for (var i = 0; i < formResolution; i++) {
    x.push(cos(angle * i) * initRadius);
    y.push(sin(angle * i) * initRadius);
    noiseSeeds.push(random(10000));  // each point gets its own position in noise space
  }

  background(30, 5, 97);  // warm off-white in HSB
}


function draw() {
  // Soft alpha rect instead of clearing -- lets strokes accumulate like watercolor
  noStroke();
  fill(30, 5, 97, 8);  // nearly transparent warm white
  rect(0, 0, width, height);

  // Float center toward mouse
  centerX += (mouseX - centerX) * 0.01;
  centerY += (mouseY - centerY) * 0.01;

  // Slowly drift the hue
  hueVal = (hueVal + 0.15) % 360;

  // --- NEW THING: breathing scale ---
  // sin() oscillates between -1 and 1, so breathScale goes between 0.75 and 1.25
  breathPhase += breathSpeed;
  var breathScale = 1 + sin(breathPhase) * 0.25;

  // Move each point using noise() instead of random()
  // noise() returns smooth values 0.0-1.0, so we subtract 0.5 to get -0.5 to 0.5
  noiseTime += noiseSpeed;
  for (var i = 0; i < formResolution; i++) {
    x[i] += (noise(noiseSeeds[i],          noiseTime) - 0.5) * stepSize * 2;
    y[i] += (noise(noiseSeeds[i] + 10000,  noiseTime) - 0.5) * stepSize * 2;
  }

  // Soft stroke -- low saturation, slightly transparent
  stroke(hueVal, 35, 60, 55);
  strokeWeight(0.75);
  noFill();

  // Apply breathing scale to all points before drawing
  beginShape();
  curveVertex(
    x[formResolution - 1] * breathScale + centerX,
    y[formResolution - 1] * breathScale + centerY
  );
  for (var i = 0; i < formResolution; i++) {
    curveVertex(x[i] * breathScale + centerX, y[i] * breathScale + centerY);
  }
  curveVertex(x[0] * breathScale + centerX, y[0] * breathScale + centerY);
  curveVertex(x[1] * breathScale + centerX, y[1] * breathScale + centerY);
  endShape();
}


function mousePressed() {
  centerX = mouseX;
  centerY = mouseY;

  var angle = radians(360 / formResolution);
  for (var i = 0; i < formResolution; i++) {
    x[i] = cos(angle * i) * initRadius;
    y[i] = sin(angle * i) * initRadius;
    noiseSeeds[i] = random(10000);  // fresh noise positions on each click
  }

  hueVal = random(360);  // random color burst on click
}


function keyReleased() {
  if (key == 's' || key == 'S') {
    saveCanvas('breath_brush_' + year() + nf(month(),2) + nf(day(),2), 'png');
  }
  if (keyCode == DELETE || keyCode == BACKSPACE) {
    background(30, 5, 97);
  }

  // Speed up / slow down the breathing
  if (key == '=' || key == '+') breathSpeed = min(breathSpeed + 0.004, 0.12);
  if (key == '-')               breathSpeed = max(breathSpeed - 0.004, 0.003);

  // Freeze
  if (key == 'f' || key == 'F') {
    freeze = !freeze;
    freeze ? noLoop() : loop();
  }
}
</script>
</body>
</html>
